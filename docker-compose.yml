services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botsbattle
      POSTGRES_PASSWORD: botsbattle
      POSTGRES_DB: botsbattle
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botsbattle"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
